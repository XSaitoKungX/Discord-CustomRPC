name: Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: linux-node_modules-${{ hashFiles('bun.lock') }}
          restore-keys: linux-node_modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 10

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint
